<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">   <!-- el enlace es privado de cada cliente: que Google no lo muestre -->
  <meta name="theme-color" content="#111111">
  <title>Seguí tu pedido | CRAVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/seguimiento.css">
</head>
<body>

  <header class="barra">
    <div class="contenedor barra-fila">
      <a class="logo" href="/" aria-label="CRAVE, volver a la carta"><img src="img/logo-crave.png" width="520" height="111" alt="CRAVE"></a>
    </div>
  </header>

  <main class="contenedor">

    <p class="cargando" id="cargando" role="status">Buscando tu pedido…</p>

    <!-- El pedido: se llena desde seguimiento.js. aria-live avisa a los lectores de pantalla cuando cambia el estado -->
    <section id="pedido" hidden>
      <p class="numero">Pedido <span id="numero" translate="no"></span></p>
      <div aria-live="polite">
        <h1 id="titulo"></h1>
        <p class="detalle" id="detalle"></p>
      </div>

      <ol class="pasos" id="pasos" aria-label="Avance del pedido"></ol>

      <p class="aviso-pago" id="aviso-pago" hidden></p>

      <dl class="datos" id="datos"></dl>
    </section>

    <!-- Enlace que no sirve (falta el código, está mal escrito o no es de ningún pedido) -->
    <section id="error" hidden>
      <h1 id="error-titulo"></h1>
      <p class="detalle" id="error-texto"></p>
    </section>

    <p class="actualizado" id="actualizado"></p>

    <a class="btn" href="/">Ir a la carta</a>
  </main>

  <script src="js/seguimiento.js"></script>
</body>
</html>
